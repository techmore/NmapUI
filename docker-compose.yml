services:
  nmapui:
    build:
      context: .
      dockerfile: Dockerfile
    image: nmapui:container
    container_name: nmapui
    environment:
      NMAPUI_DATA_DIR: /data
      NMAPUI_PORT: "9000"
    ports:
      - "9000:9000"
    volumes:
      - nmapui-data:/data
    init: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/api/app-identity"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nmapui-data:
