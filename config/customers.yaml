description: Customer network fingerprinting database
indexing:
  enabled: true
  index_fields:
  - customer_id
  - timestamp
  - exit_ip
  - hop_count
  - total_latency
  - network_signature
  - confidence_score
  max_entries: 10000
  retention_days: 90
  storage_path: data/scan_history.json
settings:
  fuzzy_ip_matching: true
  min_confidence: 0.7
  weights:
    exit_ip: 0.3
    hop_pattern: 0.4
    latency: 0.2
    network_size: 0.1
unknown_customer:
  confidence: 0.0
  description: Unidentified network - requires manual labeling
  fingerprint_patterns:
  - indicators:
    - private_gateway: 192.168.1.1
    - hop_count: 2-5
    - exit_latency: 5-50ms
    type: residential
  - indicators:
    - private_gateway: 10.*.*.*
    - hop_count: 3-8
    - exit_latency: 5-30ms
    type: corporate
  - indicators:
    - private_gateway: 10.*.*.*
    - hop_count: 4-10
    - exit_latency: 20-100ms
    type: mobile/cellular
  id: unknown
  name: Unknown Network
version: '1.0'
